# Multi-stage CI/CD workflow for testing, building, and deploying PrintX to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['master']

  # Allows running this workflow manually from the Actions tab with optional flags
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Bypass test, lint, and typecheck jobs (use if already verified in PR)'
        required: false
        default: false
        type: boolean
      skip_audit:
        description: 'Bypass dependency security audit check'
        required: false
        default: false
        type: boolean

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Stage 1: Continuous Integration & Verification (Testing & Code Quality)
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: 1. Testing & Code Quality
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency vulnerabilities
        if: ${{ !inputs.skip_audit }}
        run: pnpm audit --audit-level high --ignore-unfixable

      - name: Check code formatting (Prettier)
        run: pnpm run format:check

      - name: Run TypeScript & React Router type-checks
        run: pnpm run typecheck

      - name: Run ESLint code linter
        run: pnpm run lint

      - name: Execute unit & i18n integrity tests (Vitest)
        run: pnpm run test

  # ════════════════════════════════════════════════════════════════════════════
  # Stage 2: Build Application & Package Pages Artifact
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: 2. Build Application Artifact
    needs: test
    if: |
      always() && !cancelled() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v6

      - name: Build production bundle & prerender routes
        env:
          BASE_URL: ${{ steps.setup_pages.outputs.base_path }}
        run: pnpm run build

      - name: Verify build output integrity
        run: |
          for FILE in "dist/client/index.html" "dist/client/dashboard/index.html" "dist/client/404.html" "dist/client/sitemap.xml" "dist/client/robots.txt" "dist/client/sw.js"; do
            if [ ! -f "$FILE" ]; then
              echo "Error: Missing expected build artifact: $FILE"
              exit 1
            fi
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist/client'

  # ════════════════════════════════════════════════════════════════════════════
  # Stage 3: Deploy to GitHub Pages
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: 3. Deploy to GitHub Pages
    needs: build
    if: |
      always() && !cancelled() &&
      needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
