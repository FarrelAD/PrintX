name: Feature request
description: Suggest an idea or enhancement for PrintX
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Before submitting, please search existing issues to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: Describe the problem or bulk-printing use case you're trying to solve.
      placeholder: 'As a print shop operator, I want to ... so that ...'
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or enhancement you'd like to see.
      placeholder: 'A clear and concise description of what you want to happen.'
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of PrintX is most affected?
      options:
        - Landing Page / UI & Design System
        - Dashboard / Projects / Datasets Management
        - Wizard Step 1 & 2 (Category & Asset Ingestion)
        - Wizard Step 3 (Konva Visual Canvas & Mapping)
        - Wizard Step 4 (Result Preview)
        - Wizard Step 5 (PDF Export, Paper Sizes, N-Up, Bleed/Crop Marks)
        - Localization / i18n
        - PWA / IndexedDB Persistence
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, mockups, screenshots, or sample print layouts here.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched for an existing issue about this feature
          required: true
        - label: I understand major features should be discussed in an issue before implementation
          required: true
